# Render Blueprint cho backend AI (Gemini Vision + Python Rule Engine).
# Render đọc render.yaml ở THƯ MỤC GỐC repo git: nếu repo git là chính thư mục `hanoi-waste-app` thì giữ nguyên `rootDir: ml`;
# nếu repo git ở cấp cha, chép file này lên gốc repo và sửa `rootDir: hanoi-waste-app/ml`.
# Lần đầu tạo Blueprint (Render Dashboard > New > Blueprint), Render sẽ hỏi giá trị các biến `sync: false`.
services:
  - type: web
    name: hanoi-waste-ai
    runtime: python
    plan: free            # gói free ngủ khi rảnh: ngày thi nhớ warm GET /health định kỳ trước demo, hoặc nâng gói trả phí.
    rootDir: ml
    buildCommand: pip install -r requirements-llm.txt
    startCommand: uvicorn serve.app_llm:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SYSTEM
        # Pipeline đầy đủ: Gemini/OpenAI Vision trích xuất vật phẩm + Python Rule Engine QĐ 87/2025/QĐ-UBND.
        value: mypkg.waste_ai:run
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false       # điền trực tiếp trên Render Dashboard (không bao giờ commit key vào git)
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MAX_CHARS
        value: "1500000"  # đủ cho ảnh JPEG ~1024px mã hóa base64
      - key: TIMEOUT_S
        value: "25"
      - key: MAX_INFLIGHT
        value: "8"
      - key: PYTHON_VERSION
        value: "3.12.4"
